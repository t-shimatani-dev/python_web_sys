[project]
name = "python-web-sys"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "blinker==1.9.0",
    "click==8.3.1",
    "flask==3.0.0",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "python-dateutil==2.8.2",
    "six==1.17.0",
    "sqlalchemy==2.0.51",
    "werkzeug==3.1.6",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
