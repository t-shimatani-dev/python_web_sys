services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      APP_ENV: production
      FLASK_DEBUG: "0"
      FLASK_RUN_HOST: 0.0.0.0
      ALLOW_EXTERNAL_DEBUG: "0"
      FLASK_RUN_PORT: "5000"
    command: ["uv", "run", "python", "app.py"]
